# Joint Bayesian SMC_FJ configuration: one global bottom-edge offset.
# Copy together with scripts/test_joint_bayesian_bottom_offset.py, then edit
# data/fault names, mesh settings, constraints, and sampling budget.

nonlinear_inversion: true
bayesian_sampling_mode: SMC_FJ
slip_sampling_mode: ss_ds
nchains: 100
chain_length: 50
smc_tempering:
  target_cov: 1.0       # Standard incremental-weight COV target
  max_delta_beta: 0.5   # Usually keep; 0.75 is an advanced schedule test
use_bounds_constraints: true
use_rake_angle_constraints: false

units:
  observation: m

clipping_options:
  enabled: false

geodata:
  verticals: [true, true]
  polys: null
  faults: null
  sigmas:
    mode: individual
    update: true
    initial_value: 0.0
    log_scaled: true

alpha:
  enabled: true
  mode: single
  update: true
  initial_value: -2.0
  log_scaled: true

faults:
  defaults:
    geometry:
      update: false
      sample_positions: [0, 0]
    method_parameters:
      update_GFs:
        method: cutde
        options: {}
      update_Laplacian:
        method: Mudpy
        bounds: [free, locked, free, free]
        topscale: 0.25
        bottomscale: 0.03

  MainFault:
    geometry:
      update: true
      sample_positions: [0, 1]
    method_parameters:
      update_fault_geometry:
        method: perturb_bottom_coords_along_fixed_direction
        average_direction: 180.0
        angle_unit: degrees
        perturbation_direction: horizontal
        use_average_strike: false
      update_mesh:
        method: generate_and_deform_mesh
        top_size: 3.0
        bottom_size: 6.0
        num_segments: 25
        disct_z: 10
